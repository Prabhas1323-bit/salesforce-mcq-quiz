seUpdate; The triggers process before delete, before insert, and before update events respectively. Which two techniques should the developer implement to ensure trigger best practices are followed? Choose 2 answers", "options": [["A", "Create helper classes to execute the appropriate logic where a record is saved."], ["B", "using the before insert and before update triggers and use Flows for the delete action."], ["C", "using all same triggers in a single trigger on the `Inputus__c` object that includes all events."], ["D", "C maintain all three triggers on the `Inputus__c` object, but move the above logic out of the triger definition."]], "answer": "ACD"}, {"id": 188, "source_num": 188, "question": "Universal Hiring uses Salesforce to capture job applications. A salesforce administrator created two custom objects; `Job__c` acting as the master object, `Job_Application__c` acting as the detail. Within the `Job__c` object, a custom multi-select picklist, `Preferred_Locations__c`, contains a list of approved states for the position. Each `Job_Application__c` record relates to a Contact within the system through a master-detail relationship. Recruiters have requested the ability to view whether the Contact's Mailing State value matches a value selected on the `Preferred_Locations__c` field, within the `Job_Application__c` record. Recruiters would like this value to be kept in sync if changes occur to the Contact's Mailing State. What is the recommended tool a developer should use to meet the business requirement?", "options": [["A", "Roll-up summary field"], ["B", "Apex trigger"], ["C", "Formula field"], ["D", "Record-trigered flow"]], "answer": "D"}, {"id": 189, "source_num": 189, "question": "Which two are phases in the Aura application event propagation framework? Choose 2 answers", "options": [["A", "Emit"], ["B", "Default"], ["C", "Bubble"], ["D", "Control"]], "answer": "BD"}, {"id": 190, "source_num": 190, "question": "A developer needs to allow users to complete a form on an Account record that will create a record for a custom object. The form needs to display different fields depending on the user’s job role. The functionality should only be available to's small group of users. Which three things should the developer do to satisfy these requirements? 3 answers", "options": [["A", "Create a Custom Permission for the users."], ["B", "Create a Lightning web component."], ["C", "Add a Dynamic Action to the Users’ assigned Page Layouts."], ["D", "Create a Dynamic Form. E.  Add a Dynamic Action to the Account Record Page."]], "answer": "AD"}, {"id": 191, "source_num": 191, "question": "A developer created this Apex trigger that calls MyClass.myStaticMethod: trigger myTrigger on Contact (before insert) { MyClass.myStaticMethod(trigger.new); } The developer creates a test class with a test method that calls MyClass.myStaticMethod directly, resulting in 81% overall code coverage. What happens when the developer tries to deploy the trigger and two classes to production, assuming no other code exists?", "options": [["A", "The deployment passes because both classes and the trigger were included in the deployment."], ["B", "The deployment fails because no assertions were made in the test method."], ["C", "The deployment fails because the Apex trigger has no code coverage."], ["D", "The deployment passes because the Apex code has the required >75% code coverage."]], "answer": "C"}, {"id": 192, "source_num": 192, "question": "A developer created a new after insert trigger on the Lead object that creates Task records for each Lead. After deploying to production, an existing outside integration that inserts Lead records in batches to Salesforce is occasionally reporting total batch failures being caused by the Task insert statement. This causes the integration process in the outside system to stop, requiring a manual restart. Which change should the developer make to allow the integration to continue when some records in a batch cause failures due to the Task insert statement, so that manual restarts are not needed?", "options": [["A", "Use the Database method with allownone set to false."], ["B", "Remove the Apex class from the integration user's profile."], ["C", "Use a try-catch block after the insert statement."], ["D", "Deactivate the trigger before the integration runs."]], "answer": "A"}, {"id": 193, "source_num": 193, "question": "developer is working on a project to import data from an external system into Salesforce. The data contains sensitive information that should not be visible to all users in Salesforce. What should the developer do to ensure that the data is secure?", "options": [["A", "Use the Salesforce CLI to import the data and set up user permissions to restrict access to sensitive data."], ["B", "Use the Apex Data Loader to import the data and write Apex code to handle security and access control."], ["C", "Use a third-party tool to encrypt the sensitive data before importing it into Salesforce."], ["D", "Use the Data Import Wizard to import the data and set up field-level security to restrict access to sensitive fields."]], "answer": "B"}, {"id": 194, "source_num": 194, "question": "A developer is implementing an Apex class for a financial system. Within the class, the variables ‘creditAamount' and ‘debitAmount’ should not be able to change once a value Is assigned. In which two ways can the developer declare the variables to ensure their value can only be assigned one time?", "options": [["A", "Use the static keyword and assign its value in a static initializer."], ["B", "Use the final keyword and assign its value when declaring the variable."], ["C", "Use the final keyword and assign its value in the class constructor."], ["D", "Use the static keyword and assign its value in the class constructor."]], "answer": "BC"}, {"id": 195, "source_num": 195, "question": "How is a controller and extension specified for a custom object named \"Notice\" on a Visualforce page?", "options": [["A", "apex:page standardController=\"Noticce” extensions=\"myControllerExtension\""], ["B", "apex:page controller=\"Notice c\" extensions=\"myControllerExtension\""], ["C", "apex:page=Notice extends=\"myControllerExtension\""], ["D", "apex:page controllers=\"Noticec, myControllerExtension\""]], "answer": "A"}, {"id": 196, "source_num": 196, "question": "A developer is integrating with a legacy on-premise SQL database. What should the developer use to ensure the data being integrated is matched to the right records in Salesforce?", "options": [["A", "External ID field"], ["B", "Formula field"], ["C", "External Object"], ["D", "Lookup field"]], "answer": "A"}, {"id": 197, "source_num": 197, "question": "A developer has identified a method in an Apex class that performs resource intensive actions in memory by iterating over the result set of a SOQL statement on the account. The method also performs a DML statement to save the changes to the database. Which two techniques should the developer implement as a best practice to ensure transaction control and avoid exceeding governor limits?", "options": [["A", "Use the Database.Savepoint method to enforce database integrity."], ["B", "Use the System.Limit class to monitor the current CPU governor limit consumption."], ["C", "Use the @ReadOnly annotation to bypass the number of rows returned by a SOQL."], ["D", "Use partial DML statements to ensure only valid data is committed."]], "answer": "AB"}, {"id": 198, "source_num": 198, "question": "Which two Agent force limitations should a developer consider when building an agent?", "options": [["A", "Custom actions that reference an Apex class or flow support only primitive data types."], ["B", "The Agent API has a 90-second timeout."], ["C", "In bound messages sent via messaging channels have character limits."], ["D", "Version control is supported for agents."]], "answer": "AB"}, {"id": 199, "source_num": 199, "question": "A developer is using Agent force Dev Assistant and noticed that the output from their prompt resembles proprietary code. Which model training considerations should the developer be aware of when utilizing the extension?", "options": [["A", "Dev Assistant can reference the developer's prior prompts to generate output in near real time."], ["B", "Dev Assistant can reference other developers' code and train the model in near real time."], ["C", "Dev Assistant generated output that resembles the code that was used to train the model."], ["D", "Dev Assistant anonymized PII data in customer code that was used to train the model."]], "answer": "C"}, {"id": 200, "source_num": 200, "question": "Which two Agentforce limitations should a developer consider when building an agent? (Choose 2 options)", "options": [["A", "Version control is supported for agents."], ["B", "Inbound messages sent via messaging channels have character limits."], ["C", "Custom actions that reference an Apex class or flow support only primitive data types."], ["D", "The Agent API has a 90-second timeout."]], "answer": "BC"}, {"id": 201, "source_num": 201, "question": "A developer Receives an Error when compiling the following code: What is the error?", "options": [["A", "Switch statements cannot contain multiple when values."], ["B", "There is incompatible variable binding."], ["C", "Only one sObject type per when block can be used."], ["D", "There is an unexpected token 'Contact'."]], "answer": "C"}];let state={mode:'home',index:0,score:0,answered:0,wrong:[],skipped:[],selected:[],locked:false,results:[],quizIds:[]};const $=id=>document.getElementById(id);function save(){localStorage.setItem('sfQuizState',JSON.stringify(state))}function load(){try{const x=JSON.parse(localStorage.getItem('sfQuizState'));if(x&&x.mode&&Array.isArray(x.results))state=x}catch(e){}}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function currentList(){return state.quizIds||[]}function renderHome(){state.mode='home';$('progressBar').style.width='0%';$('scorePill').textContent='Score: '+state.score; $('main').innerHTML=`<section class="card home"><h2>201 MCQ Practice 🚀</h2><p>Practice the questions from your uploaded Salesforce Platform Developer PDF.</p><div class="stats"><div class="stat"><b>201</b><span>Questions</span></div><div class="stat"><b>${state.score}</b><span>Current Score</span></div><div class="stat"><b>${state.wrong.length}</b><span>Wrong</span></div></div><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="start('all')">Start / Restart Quiz</button>${state.wrong.length?'<button class="btn secondary" onclick="start(\'retry\')">Retry Wrong ('+state.wrong.length+')</button>':''}<button class="btn danger" onclick="resetAll()">Reset Progress</button></div><p class="source-note">Correct answers are taken from the highlighted answers in the supplied PDF. A few source questions have incomplete option text; they are kept as provided.</p></section>`}function start(mode){if(mode==='all'){state={mode:'all',index:0,score:0,answered:0,wrong:[],skipped:[],selected:[],locked:false,results:[],quizIds:shuffle(QUESTIONS.map((_,i)=>i))}}else{state.mode='retry';state.quizIds=shuffle([...state.wrong]);state.index=0;state.score=0;state.answered=0;state.selected=[];state.locked=false;state.results=[];state.skipped=[]}save();renderQuestion()}function renderQuestion(){let ids=currentList();if(state.index>=ids.length){renderResults();return}let qi=ids[state.index],q=QUESTIONS[qi],multi=q.answer.length>1;state.selected=[];state.locked=false;let pct=Math.round((state.index/ids.length)*100);$('progressBar').style.width=pct+'%';$('scorePill').textContent='Question '+(state.index+1)+' / '+ids.length;let opts=q.options.map(([l,t])=>`<button class="opt" id="opt-${l}" onclick="choose('${l}')"><span class="letter">${l}.</span>${esc(t)}</button>`).join('');$('main').innerHTML=`<section class="card question-card"><div class="qmeta">Question ${state.index+1} of ${ids.length} · PDF Question ${q.source_num} · ${multi?'Select '+q.answer.length+' answers':'Select one answer'}</div><h2 class="question">${esc(q.question)}</h2><div class="option-list">${opts}</div><div id="feedback"></div><div class="actions"><button class="btn secondary" onclick="skip()">Skip</button><div><button id="checkBtn" class="btn primary" onclick="submitAnswer()" disabled>${multi?'Check Answer':'Submit Answer'}</button></div></div></section>`}function choose(letter){if(state.locked)return;let q=QUESTIONS[currentList()[state.index]],multi=q.answer.length>1;if(multi){const i=state.selected.indexOf(letter);if(i>=0)state.selected.splice(i,1);else state.selected.push(letter);document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));state.selected.forEach(l=>document.getElementById('opt-'+l)?.classList.add('selected'));}else{state.selected=[letter];document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));document.getElementById('opt-'+letter)?.classList.add('selected')}$('checkBtn').disabled=state.selected.length===0}function submitAnswer(){if(state.locked||!state.selected.length)return;let ids=currentList(),qi=ids[state.index],q=QUESTIONS[qi],correct=[...q.answer].sort().join('')===[...state.selected].sort().join('');state.locked=true;state.answered++;if(correct)state.score++;else if(!state.wrong.includes(qi))state.wrong.push(qi);state.results.push({qi,selected:[...state.selected],correct});document.querySelectorAll('.opt').forEach(b=>{let l=b.id.slice(-1);if(q.answer.includes(l))b.classList.add('correct');if(state.selected.includes(l)&&!q.answer.includes(l))b.classList.add('wrong')});$('feedback').innerHTML=correct?`<div class="feedback good">✅ Correct answer.</div>`:`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${q.answer}</b>. Added to Retry Wrong.</div>`;$('checkBtn').textContent='Next Question →';$('checkBtn').disabled=false;$('checkBtn').onclick=next;save();$('scorePill').textContent='Question '+(state.index+1)+' / '+ids.length}function next(){state.index++;state.selected=[];state.locked=false;renderQuestion()}function skip(){let ids=currentList(),qi=ids[state.index];if(!state.skipped.includes(qi))state.skipped.push(qi);state.index++;state.selected=[];state.locked=false;save();renderQuestion()}function renderResults(){$('progressBar').style.width='100%';$('scorePill').textContent='Score: '+state.score;let ids=currentList();let total=ids.length,pct=total?Math.round(state.score/total*100):0;let wrongInRun=state.results.filter(x=>!x.correct).length;let retry=state.wrong.length;let retryBtn=retry?`<button class="btn secondary" onclick="start('retry')">Retry Wrong (${retry})</button>`:'';$('main').innerHTML=`<section class="card results"><h2>🎉 Quiz Complete</h2><div class="bigscore">${state.score} / ${total}</div><p style="text-align:center" class="muted">${pct}% score · Wrong this run: ${wrongInRun} · Skipped: ${state.skipped.length}</p><div class="stats"><div class="stat"><b>${state.score}</b><span>Correct</span></div><div class="stat"><b>${wrongInRun}</b><span>Wrong</span></div><div class="stat"><b>${state.skipped.length}</b><span>Skipped</span></div></div><div class="toolbar"><button class="btn primary" onclick="start('all')">Practice Again</button>${retryBtn}<button class="btn secondary" onclick="renderHome()">Home</button></div><div class="review">${state.results.filter(x=>!x.correct).map(x=>{let q=QUESTIONS[x.qi];return `<div class="review-item"><b>PDF Q${q.source_num}</b> — ${esc(q.question)}<br><span class="small">Your answer: ${x.selected.join(', ')||'Skipped'} · Correct: ${q.answer}</span></div>`}).join('')}</div></section>`;save()}function resetAll(){if(confirm('Reset all quiz progress?')){localStorage.removeItem('sfQuizState');state={mode:'home',index:0,score:0,answered:0,wrong:[],skipped:[],selected:[],locked:false,results:[]};renderHome()}}load();renderHome();</script></body></html>
