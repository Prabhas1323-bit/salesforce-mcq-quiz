<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salesforce Platform Developer — MCQ Practice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#172033}.app{width:min(1280px,100%);margin:auto;padding:24px 32px 40px}.top{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.96);backdrop-filter:blur(10px);padding:10px 0 16px}.brand{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand h1{font-size:25px;margin:0}.pill{background:#fff;border:1px solid #dfe5ef;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;white-space:nowrap}.progress{height:10px;background:#dfe5ef;border-radius:99px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#1473e6;transition:.25s}.card{background:#fff;border:1px solid #e0e6ef;border-radius:20px;padding:34px 40px;margin-top:18px;box-shadow:0 8px 30px rgba(20,35,60,.06)}.qmeta{font-size:14px;color:#657089;margin-bottom:14px}.question{font-size:23px;line-height:1.55;font-weight:700;margin:0 0 24px;white-space:pre-wrap;max-width:1100px}.opt{display:block;width:100%;min-height:58px;text-align:left;border:2px solid #e1e6ef;background:#fff;border-radius:14px;padding:15px 18px;margin:0;cursor:pointer;font-size:16px;line-height:1.5;transition:.15s}.opt:hover{border-color:#8dbcf5;background:#f7fbff}.opt.selected{border-color:#1473e6;background:#edf6ff}.opt.correct{border-color:#1a9b55;background:#eaf9f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.letter{font-weight:800;display:inline-block;width:30px}.feedback{padding:13px 15px;border-radius:12px;margin-top:18px;font-size:15px}.feedback.good{background:#eaf9f0;color:#176b3d}.feedback.bad{background:#fff0f0;color:#9d2929}.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 19px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:#1473e6;color:#fff}.secondary{background:#e9eef6;color:#23314a}.danger{background:#fff0f0;color:#a12828}.btn:disabled{opacity:.45;cursor:not-allowed}.home{text-align:center;padding:60px 40px}.home h2{font-size:36px;margin:0 0 12px}.home p{color:#637087;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{background:#f7f9fc;border-radius:14px;padding:18px;text-align:center}.stat b{display:block;font-size:28px}.results h2{margin-top:0}.bigscore{font-size:52px;font-weight:900;text-align:center;margin:10px}.muted{color:#6b768a}.hidden{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:12px}.source-note{font-size:12px;color:#7b8495;margin-top:20px}.review{margin-top:24px}.review-item{border:1px solid #e1e6ef;border-radius:12px;padding:14px;margin:9px 0;line-height:1.45}@media(min-width:900px){.card.question-card{max-width:1240px}.card.question-card .option-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card.question-card .option-list .opt{height:100%;margin:0}.question-card .actions{position:sticky;bottom:12px;background:rgba(255,255,255,.96);padding-top:10px}}@media(max-width:899px){.app{padding:18px 20px 30px}.card{padding:26px}.question{font-size:21px}}@media(max-width:600px){.app{padding:12px}.card{padding:17px;border-radius:16px}.question{font-size:18px}.stats{grid-template-columns:1fr 1fr 1fr}.brand h1{font-size:18px}.btn{padding:11px 13px}.card.question-card .option-list{display:block}.card.question-card .option-list .opt{margin:10px 0}.home{padding:40px 18px}}</style></head><body><div class="app"><div class="top"><div class="brand"><h1>Salesforce Platform Developer</h1><div class="pill" id="scorePill">Score: 0</div></div><div class="progress"><div id="progressBar" style="width:0%"></div></div></div><main id="main"></main></div><script>const QUESTIONS=[{"id": 1, "source_num": 1, "question": "Which exception type cannot be caught?", "options": [["A", "A custom exception"], ["B", "LimitException"], ["C", "NoAccessException"], ["D", "CalloutException"]], "answer": "B"}, {"id": 2, "source_num": 2, "question": "A developer created a child Lightning web component nested inside a parent Lightning web component. The parent component needs to pass a string value to the child component. In which two ways can this be accomplished?", "options": [["A", "The parent component can invoke a public method in the child component."], ["B", "The parent component can use a public property to pass the data to the child component."], ["C", "The parent component can use the Apex controller class to send data to the child component."], ["D", "The parent component can use a custom event to pass the data to the child component."]], "answer": "AB"}, {"id": 3, "source_num": 3, "question": "Flow Builder uses an Apex action to provide additional information about multiple Contacts, stored in a custom `ContactInfo`. Which is the correct definition of the Apex method that gets the additional information?", "options": [["A", "@InvocableMethod(label='Additional Info') public List<ContactInfo> getInfo(List<Id> contactIds) { /*implementation*/ }"], ["B", "@InvocableMethod(label='Additional Info') public ContactInfo getInfo(Id contactId) { /*implementation*/ }"], ["C", "@InvocableMethod(label='Additional Info') public static ContactInfo getInfo(Id contactId) { /*implementation*/ }"], ["D", "@InvocableMethod(label='Additional Info') public static List<ContactInfo> getInfo(List<Id> contactIds)"]], "answer": "D"}, {"id": 4, "source_num": 4, "question": "When a user edits the Postal Code on an Account, a custom Account text field named \"Timezone\" must be updated based on the values in a `PostalCodeToTimezone__c` custom object. Which two automation tools can be used to implement this feature?", "options": [["A", "Approval process"], ["B", "Quick actions"], ["C", "Fast Field Updates record-triggered flow"], ["D", "Account trigger"]], "answer": "CD"}, {"id": 5, "source_num": 5, "question": "Which statement generates a list of Leads and Contacts that have a field with the phrase 'ACME'?", "options": [["A", "List <sObject> searchList = [FIND '*ACME*' IN ALL FIELDS RETURNING Contact, Lead];"], ["B", "Map <sObject> searchList = [FIND '*ACME*' IN ALL FIELDS RETURNING Contact, Lead];"], ["C", "List<List <sObject>> searchList = [SELECT Name, ID FROM Contact, Lead WHERE Name like '%ACME%'];"], ["D", "List<List <sObject>> searchList = [FIND '*ACME*' IN ALL FIELDS RETURNING Contact, Lead];"]], "answer": "D"}, {"id": 6, "source_num": 6, "question": "Which scenario is valid for execution by unit tests?", "options": [["A", "Generate a Visualforce PDF with getContentAsPDF()."], ["B", "Execute anonymous Apex as a different user."], ["C", "Set the created date of a record using a system method."], ["D", "Load data from a remote site with a callout."]], "answer": "C"}, {"id": 7, "source_num": 7, "question": "A developer is tasked with building a custom Lightning web component to collect Contact information. The form will be shared among many different types of users in the org. There are security requirements that only certain should be edited and viewed by certain groups of users. What should the developer use in their Lightning Web Component to support the security requirements?", "options": [["A", "aura-input-field"], ["B", "ui-input-field"], ["C", "lightning-input-field"], ["D", "forca-input-field"]], "answer": "C"}, {"id": 8, "source_num": 8, "question": "Universal Containers decides to use purely declarative development to build out a new Salesforce application. Which two options can be used to build out the business logic layer for this application?", "options": [["A", "Record-Triggered Flow"], ["B", "Batch Jobs"], ["C", "Validation Rules"], ["D", "Remote Actions"]], "answer": "AC"}, {"id": 9, "source_num": 9, "question": "A developer created these three Rollup Summary fields in the custom object, Project__c: Total_Timesheets_c Total_Approved_Timesheets_c Total_Rejected_Timesheet_c The developer is asked to create a new field that shows the ratio between rejected and approved timesheets for a new field. Which should the developer use to implement the business requirement in order to minimize maintenance overhead?", "options": [["A", "Apex trigger"], ["B", "Roll-up summary field"], ["C", "Record-triggered flow"], ["D", "Formula field"]], "answer": "D"}, {"id": 10, "source_num": 10, "question": "A developer is asked to update code that requires them to validate input into a trigger. Which Apex Control Flow Statement should the developer use?", "options": [["A", "Conditional (If-Else) Statement"], ["B", "While Loop"], ["C", "Switch Statement"], ["D", "For Loop"]], "answer": "A"}, {"id": 11, "source_num": 11, "question": "A developer wants to send an outbound message when a record meets a specific criteria. Which two features satisfy this use case?", "options": [["A", "Flow Builder can be used to check the record criteria and send an outbound message."], ["B", "Approval Process can be used to check the record criteria and send an outbound message without Apex code."], ["C", "Next Best Action can be used to check the record criteria and send an outbound message."], ["D", "Entitlement Process can be used to check the record criteria and send an outbound message without Apex code."]], "answer": "AB"}, {"id": 12, "source_num": 12, "question": "Which two events need to happen when deploying to a production org?", "options": [["A", "All Apex code must have at least 75% test coverage."], ["B", "All custom objects must have visibility set to a value other than In Development."], ["C", "All Visual flows must have at least 1% test coverage."], ["D", "All triggers must have some test coverage."]], "answer": "AD"}, {"id": 13, "source_num": 13, "question": "A company has a custom object, Sales_Help_Request__c, that has a Lookup relationship to Opportunity. The Sales_Help_Request__c has a number field, Number_of_Hours__c, that represents the amount of time spent on Sales_Help_Request__c. A developer is tasked with creating a field, Total_Hours__c, on Opportunity that should be the sum of all of the Number_of_Hours__c values for the Sales_Help_Request__c records related to that Opportunity. What should the developer use to implement this?", "options": [["A", "A roll-up summary field on the Sales_Help_Request__c object"], ["B", "A roll-up summary field on the Opportunity object"], ["C", "A record-triggered flow on the Sales_Help_Request__c object"], ["D", "A trigger on the Opportunity object"]], "answer": "AB"}, {"id": 14, "source_num": 14, "question": "Which three Salesforce resources can be accessed from a Lightning web component?", "options": [["A", "Content asset files"], ["B", "SVG resources"], ["C", "All external libraries"], ["D", "Third-party web components E. Static resources"]], "answer": "BCD"}, {"id": 15, "source_num": 15, "question": "Universal Containers hires a developer to build a custom search page to help users find the Accounts they want. Users will be able to search on Name, Description, and a custom comments field. Which consideration should the developer be aware of when deciding between SOQL and SOSL?", "options": [["A", "SOSL is able to return more records."], ["B", "SOQL is able to return more records."], ["C", "SOSL is faster for text searches."], ["D", "SOQL is faster for text searches."]], "answer": "BC"}, {"id": 16, "source_num": 16, "question": "Universal Containers needs to create a custom user interface component that allows users to enter information about their accounts. The component should be able to validate the user input before saving the information to the database. What is the best technology to create this component?", "options": [["A", "Visualforce"], ["B", "Lightning Web Components"], ["C", "Flow"], ["D", "VUE JavaScript framework"]], "answer": "B"}, {"id": 17, "source_num": 17, "question": "Refer to the code snippet below: import fetchOpps from '@salesforce/apex/OpportunitySearch.fetchOpportunities'; @wire(fetchOpps) opportunities; When a Lightning web component is rendered, a list of opportunities that match certain criteria should be retrieved database and displayed to the end-user. Which three considerations must the developer implement to make the fetchOpportunities method available when Lightning web component?", "options": [["A", "The method must be annotated with the @AuraEnabled annotation."], ["B", "The method must be annotated with the @InvocableMethod annotation."], ["C", "The method cannot mutate the result set retrieved from the database."], ["D", "The method must specify the (cacheable=true) attribute. E. The method must specify the (continuation=true) attribute."]], "answer": "ACD"}, {"id": 18, "source_num": 18, "question": "Which three resources in an Aura component can contain JavaScript functions?", "options": [["A", "Helper"], ["B", "Style"], ["C", "Design"], ["D", "Renderer E. Controller"]], "answer": "AD"}, {"id": 19, "source_num": 19, "question": "Where are two locations a developer can look to find information about the status of batch or future methods?", "options": [["A", "Apex Flex Queue"], ["B", "Apex Jobs"], ["C", "Paused Flow Interviews component"], ["D", "Developer Console"]], "answer": "AB"}, {"id": 20, "source_num": 20, "question": "Which code statement includes an Apex method named updateAccounts in the class AccountController for use in a Lightning web component?", "options": [["A", "import updateAccounts from 'AccountController';"], ["B", "import updateAccounts from '@salesforce/apex/AccountController.updateAccounts';"], ["C", "import updateAccounts from '@salesforce/apex/AccountController';"], ["D", "import updateAccounts from 'AccountController.updateAccounts';"]], "answer": "C"}, {"id": 21, "source_num": 21, "question": "Universal Containers wants Opportunities to no longer be editable when it reaches the Closed/Won stage. Which two strategies can a developer use to accomplish this?", "options": [["A", "Use a validation rule."], ["B", "Use an auto-response rule."], ["C", "Use a before-save Apex trigger."], ["D", "Use an automatically launched Approval Process."]], "answer": "AC"}, {"id": 22, "source_num": 22, "question": "What are two benefits of using declarative customizations over code?", "options": [["A", "Declarative customizations automatically generate test classes."], ["B", "Declarative customizations automatically update with each Salesforce release."], ["C", "Declarative customizations generally require less maintenance."], ["D", "Declarative customizations cannot generate run time errors."]], "answer": "BC"}, {"id": 23, "source_num": 23, "question": "A team of many developers work in their own individual orgs that have the same configuration as the production org. Which type of org is best suited for this scenario?", "options": [["A", "Partner Developer Edition"], ["B", "Developer Sandbox"], ["C", "Full Sandbox"], ["D", "Developer Edition"]], "answer": "C"}, {"id": 24, "source_num": 24, "question": "A developer has an integer variable called maxAttempts. The developer needs to ensure that once maxAttempts is initialized, it preserves its value for the length of the Apex transaction; while being able to share the variable's state between trigger executions. How should the developer declare maxAttempts to meet these requirements?", "options": [["A", "Declare maxAttempts as a private static variable on a helper class."], ["B", "Declare maxAttempts as a member variable on the trigger definition."], ["C", "Declare maxAttempts as a constant using the static and final keywords."], ["D", "Declare maxAttempts as a variable on a helper class."]], "answer": "C"}, {"id": 25, "source_num": 25, "question": "A developer needs to create a baseline set of data (Accounts, Contacts, Products, Assets) for an entire suite of Apex tests allowing them to test isolated requirements for various types of Salesforce cases. Which approach can efficiently generate the required data for each unit test?", "options": [["A", "Create a mock using the HttpCalloutMock interface."], ["B", "Use @TestSetup with a void method."], ["C", "Add @IsTest(seeAllData=true) at the start of the unit test class."], ["D", "Create test data before Test.startTest() in the unit test."]], "answer": "B"}, {"id": 26, "source_num": 26, "question": "What is one limitation of Agentforce's language support capabilities?", "options": [["A", "Language support for toxicity is the same as the supported languages."], ["B", "Topic and action instructions are supported in multiple languages."], ["C", "Language and tone settings impact the output of agent actions when specified."], ["D", "Language support may differ by agent type."]], "answer": "D"}, {"id": 27, "source_num": 27, "question": "A developer is creating an app that contains multiple Lightning web components. One of the child components is used for navigation purposes. When a user clicks a button called Next in the child parent component must be alerted so it can navigate to the next page. How should this be accomplished?", "options": [["A", "Update a property on the parent."], ["B", "Create a custom event."], ["C", "Fire a notification."], ["D", "Call a method in the Apex controller."]], "answer": "B"}, {"id": 28, "source_num": 28, "question": "Which two settings must be defined in order to update a record of a junction object?", "options": [["A", "Read access on the primary relationship"], ["B", "Read/Write access on the primary relationship"], ["C", "Read/Write access on the secondary relationship"], ["D", "Read/Write access on the junction object"]], "answer": "BC"}, {"id": 29, "source_num": 29, "question": "A company has a custom object, Order__c, that has a required, unique external ID field called Order_Number__c. Which statement should be used to perform the DML necessary to insert new records and update existing records in a list of Order__c records using the external ID field?", "options": [["A", "upsert orders;"], ["B", "merge orders;"], ["C", "merge orders Order_Number__c;"], ["D", "upsert orders Order_Number__c;"]], "answer": "D"}, {"id": 30, "source_num": 30, "question": "Which annotation exposes an Apex class as a RESTful web service?", "options": [["A", "@AuraEnabled(cacheable=true)"], ["B", "@RemoteAction"], ["C", "@HttpInvocable"], ["D", "@RestResource(urlMapping='/myService/**)"]], "answer": "A"}, {"id": 31, "source_num": 31, "question": "What can be used to override the Account's standard Edit button for Lightning Experience?", "options": [["A", "Lightning flow"], ["B", "Lightning page"], ["C", "Lightning action"], ["D", "Lightning component"]], "answer": "D"}, {"id": 32, "source_num": 32, "question": "What is a benefit of developing applications in a multi-tenant environment?", "options": [["A", "Unlimited processing power and memory"], ["B", "Enforced unit testing and code coverage best practices"], ["C", "Preconfigured storage for big data"], ["D", "Access to predefined computing resources"]], "answer": "D"}, {"id": 33, "source_num": 33, "question": "A developer must create a CreditCardPayment class that provides an implementation of an existing Payment class. public virtual class Payment { public virtual void makePayment(Decimal amount) { /*implementation*/ } } Which is the correct implementation?", "options": [["A", "public class CreditCardPayment extends Payment { public override void makePayment(Decimal amount) { /*implementation*/ } }"], ["B", "public class CreditCardPayment implements Payment { public override void makePayment(Decimal amount) { /*implementation*/ } }"]], "answer": "A"}, {"id": 34, "source_num": 34, "question": "A developer is using Agentforce Dev Assistant. Inline autocomplete is not available. What are two possible causes?", "options": [["A", "Auto Completions are toggled off."], ["B", "Telemetry settings are misconfigured."], ["C", "VSCode has been idle for 1 hour."], ["D", "VSCode Inline Suggest is not enabled."]], "answer": "AD"}, {"id": 35, "source_num": 35, "question": "A developer is creating a Lightning web component to show a list of sales records. The Sales Representative user should be able to see the commission field on each record. The Sales Assistant user to see all fields on the record except the commission field. How should this be enforced so that the component works for both users without showing any errors?", "options": [["A", "Use Security.stripInaccessible to remove fields inaccessible to the current user."], ["B", "Use Lightning Data Service to get the collection of sales records."], ["C", "Use WITH SECURITY_ENFORCED in the SOQL that fetches the data for the component."], ["D", "Use Lightning Locker Service to enforce sharing rules and field-level security."]], "answer": "A"}, {"id": 36, "source_num": 36, "question": "Which three statements are accurate about debug logs?", "options": [["A", "Debug log levels are cumulative, where FINE log level includes all events logged at the DEBUG, INFO, WARN, and ERROR levels."], ["B", "System debug logs are retained for 24 hours."], ["C", "Only the 20 most recent debug logs for a user are kept."], ["D", "Debug logs can be set for specific users, classes, and triggers. E. The maximum size of a debug log is 5 MB."]], "answer": "BD"}, {"id": 37, "source_num": 37, "question": "What are three ways for a developer to execute tests in an org?", "options": [["A", "Tooling API"], ["B", "Salesforce DX"], ["C", "Metadata API"], ["D", "Setup Menu E. Bulk API"]], "answer": "ABD"}, {"id": 38, "source_num": 38, "question": "What are two use cases for executing Anonymous Apex code?", "options": [["A", "To schedule an Apex class to run periodically"], ["B", "To delete 15,000 inactive Accounts in a single transaction after a deployment"], ["C", "To run a batch Apex class to update all Contacts"], ["D", "To add unit test code coverage to an org"]], "answer": "AC"}, {"id": 39, "source_num": 39, "question": "An Opportunity needs to have an amount rolled up from a custom object that is not in a master- detail relationship. How can this be achieved?", "options": [["A", "Use the Metadata API to create real-time roll-up summaries."], ["B", "Write a trigger on the child object and use an aggregate function to sum the amount for all related child objects under the Opportunity."], ["C", "Write a trigger on the Opportunity object and use tree sorting to sum the amount for all related child objects under the Opportunity."], ["D", "Use the Streaming API to create real-time roll-up summaries."]], "answer": "B"}, {"id": 40, "source_num": 40, "question": "A developer created a trigger on the Account object. While testing the trigger, the developer sees the error message 'Maximum trigger depth exceeded'. What could be the possible causes?", "options": [["A", "The trigger is getting executed multiple times."], ["B", "The trigger is too long and should be refactored into a helper class."], ["C", "The trigger does not have sufficient code coverage."], ["D", "The developer does not have the correct user permission."]], "answer": "A"}, {"id": 41, "source_num": 41, "question": "In the following example, which sharing context will myMethod execute when it is invoked? public Class myClass { public void myMethod() { /* implementation */ }", "options": [["A", "Sharing rules will be inherited from the calling context."], ["B", "Sharing rules will be enforced for the running user."], ["C", "Sharing rules will not be enforced for the running user."], ["D", "Sharing rules will be enforced by the instantiating class."]], "answer": "A"}, {"id": 42, "source_num": 42, "question": "Universal Containers wants to ensure that all new leads created in the system have a valid email address. They have already created a validation rule to enforce this requirement, but want to add an additional layer of validation using automation. What would be the best solution for this requirement?", "options": [["A", "Use a custom Lightning Web component to make a callout to validate the fields on a third party system."], ["B", "Use a before-save Apex trigger on the Lead object to validate the email address and display an error message if it is invalid"], ["C", "Submit a REST API Callout with a JSON payload and validate the fields on a third party system"], ["D", "Use an Approval Process to enforce the completion of a valid email address using an outbound message action."]], "answer": "B"}, {"id": 43, "source_num": 43, "question": "While working in a sandbox, an Apex test fails when run in the Test Runner. However, executing the Apex logic in the Execute Anonymous window succeeds with no exceptions or errors. Why did the method fail in the sandbox test framework but succeed in the Developer Console?", "options": [["A", "The test method relies on existing data in the sandbox."], ["B", "The test method has a syntax error in the code."], ["C", "The test method is calling an @future method."], ["D", "The test method does not use System.runAs to execute as a specific user."]], "answer": "A"}, {"id": 44, "source_num": 44, "question": "A developer must perform a complex SOQL query that joins two objects in a Lightning component. How can the Lightning component execute the query?", "options": [["A", "Create a flow to execute the query and invoke from the Lightning component."], ["B", "Invoke an Apex class with the method annotated as @AuraEnabled to perform the query."], ["C", "Write the query in a custom Lightning web component wrapper and invoke from the Lightning component."], ["D", "Use the Salesforce Streaming API to perform the SOQL query."]], "answer": "B"}, {"id": 45, "source_num": 45, "question": "What will be the output in the debug log in the event of a QueryException during a call to the aQuery method if it is following example? public class myclass { class CustomException extends Exception {} public static Account aQuery() { Account theAccount; try { system.debug('Querying Accounts.\"); theAccount = [SELECT Id FROM Account WHERE CreatedDate > TODAY]; } catch (CustomException ex) { system.debug('Custom Exception.\"); } catch (QueryException ex) { system.debug('Query Exception.\"); } finally { system.debug('Done.\"); } return theAccount; }", "options": [["A", "Querying Accounts. Custom Exception."], ["B", "Querying Accounts. Custom Exception. Done."], ["C", "Querying Accounts. Query Exception. Done."], ["D", "Querying Accounts. Query Exception."]], "answer": "C"}, {"id": 46, "source_num": 46, "question": "Which code displays the contents of a Visualforce page as a PDF?", "options": [["A", "<apex:page contentType=\"application/pdf\">"], ["B", "<apex:page renderAs=\"pdf\">"], ["C", "<apex:page renderAs=\"application/pdf\">"], ["D", "<apex:page contentType=\"pdf\">"]], "answer": "B"}, {"id": 47, "source_num": 47, "question": "A developer created a trigger on the Account object and wants to test if the trigger is properly bulkified. The developer team decided that the trigger should be tested with 200 account records with unique names. What two things should be done to create the test data within the unit test with the least amount of code?", "options": [["A", "Create a static resource containing test data."], ["B", "Use the @isTest(isParallel=true) annotation in the test class."], ["C", "Use Test.loadData to populate data in your test methods."], ["D", "Use the @isTest(seeAllData=true) annotation in the test class."]], "answer": "AC"}, {"id": 48, "source_num": 48, "question": "A Developer Edition org has five existing accounts. A developer wants to add 10 more accounts for testing purpose. The following code is executed in the Developer Console using the Execute Anonymous window: Account myAccount = new Account (Name = 'MyAccount'); insert myAccount; Integer x = 1; List<Account> newAccounts = new List<Account>(); do { Account acct = new Account (Name = 'New Account ' + x++); newAccounts.add(acct); } while (x < 10); How many total accounts will be in the org after this code is executed?", "options": [["A", "15"], ["B", "6"], ["C", "5"], ["D", "10"]], "answer": "D"}, {"id": 49, "source_num": 49, "question": "Universal Containers has a support process that allows users to request support from its engineering team using a custom Engineering_Support__c. Users should be able to associate multiple Engineering_Support__c records to a single Opportunity record. Additional aggregate information about the Engineering_Support__c records should be shown on the Opportunity record. Which relationship field should be implemented to support these requirements?", "options": [["A", "Lookup field from Engineering_Support__c to Opportunity"], ["B", "Master-detail field from Engineering_Support__c to Opportunity"], ["C", "Master-detail field from Opportunity to Engineering_Support__c"]], "answer": "B"}, {"id": 50, "source_num": 50, "question": "Which two operations affect the number of times a trigger can fire?", "options": [["A", "After-save record-triggered flow"], ["B", "Email messages"], ["C", "Roll-up summary fields"], ["D", "Criteria-based sharing calculations"]], "answer": "AC"}, {"id": 51, "source_num": 51, "question": "Universal Containers has an order system that uses an Order Number to identify an order for customers and service agents. Order records will be imported into Salesforce. How should the Order Number field be defined in Salesforce?", "options": [["A", "Indirect Lookup"], ["B", "External ID and Unique"], ["C", "Lookup"], ["D", "Direct Lookup"]], "answer": "B"}, {"id": 52, "source_num": 52, "question": "If Apex code executes inside the execute() method of an Apex class when implementing the Batchable interface, which two statements are true regarding governor limits?", "options": [["A", "The Apex governor limits are omitted while calling the constructor of the Apex class."], ["B", "The Apex governor limits will use the asynchronous s"], ["B", "Importing data using the Data Loader and the Bulk API"], ["C", "Renaming or replacing picklists"], ["D", "Updating addresses using the Mass Address update tool"]], "answer": "B"}, {"id": 57, "source_num": 57, "question": "Management asked for opportunities to be automatically created for accounts with annual revenue greater than $1,000. developer created the following trigger on the Account object to satisfy this requirement. for (Account a: Trigger.new) { if (a.AnnualRevenue > 1000000) { List<Opportunity> oppList = [SELECT Id FROM Opportunity WHERE accountId = :a.Id] if(oppList.size() == 0) { Opportunity oppty = new Opportunity{Name = a.name, StageName = 'Prospecting' CloseDate = system.today().addDays(30)); insert oppty; } } } Users are able to update the account records via the UI and can see an opportunity created for high annual revenue across all accounts unless the administrator tries to upload a list of 170 accounts using DataLoader. If file adds current \"Process\" files, then the account records will be updated accordingly. Users are able to update the account records via the UI and can see an opportunity created for high annual revenue account. However, when the administrator tries to upload a list of 179 accounts using Data Loader, it fails with System.Exception errors. Which two actions should the developer take to fix the code segment shown above?", "options": [["A", "Move the DML that saves opportunities outside the for loop."], ["B", "Check if all the required fields for Opportunity are being added on creation."], ["C", "Use Database.query to query the opportunities."], ["D", "Query for existing opportunities outside the for loop."]], "answer": "AD"}, {"id": 58, "source_num": 58, "question": "In terms of the MVC paradigm, what are two advantages of implementing the view layer of a Salesforce application using Lightning Web Component-based development over Visualforce?", "options": [["A", "Rich component ecosystem"], ["B", "Server-side run-time debugging"], ["C", "Self-contained and reusable units of an application"], ["D", "Automatic code generation"]], "answer": "AC"}, {"id": 59, "source_num": 59, "question": "A developer has the following requirements: - Calculate the total amount on an Order. - Calculate the line amount for each Line Item based on quantity selected and price. - Move Line Items to a different Order if a Line Item is not in stock. Which relationship implementation supports these requirements on its own?", "options": [["A", "Line Item has a re-parentable lookup field to Order."], ["B", "Order has a re-parentable master-detail field to Line Item."], ["C", "Order has a re-parentable lookup field to Line Item."], ["D", "Line Item has a re-parentable master-detail field to Order."]], "answer": "D"}, {"id": 60, "source_num": 60, "question": "The OrderHelper class is a utility class that contains business logic for processing orders. Consider the following code snippet: public class without sharing OrderHelper{ //code implementation } A developer needs to create a constant named DELIVERY_MULTIPLIER with a value of 4.15. The value of the constant should not change at any time in the code. How should the developer declare the DELIVERY_MULTIPLIER constant to meet the business objectives?", "options": [["A", "static final decimal DELIVERY_MULTIPLIER = 4.15;"], ["B", "decimal DELIVERY_MULTIPLIER = 4.15;"], ["C", "static decimal DELIVERY_MULTIPLIER = 4.15;"]], "answer": "A"}, {"id": 61, "source_num": 61, "question": "A developer created a lightning web component called statusComponent to be inserted into the Account record page. Which two things should the developer do to make this component available?", "options": [["A", "Add <masterLabel>Account</masterLabel> to the statusComponent.js-meta.xml file."], ["B", "Add <target>Lightning_RecordPage</target> to the statusComponent.js file."], ["C", "Add <target>Lightning_RecordPage</target> to the statusComponent.js-meta.xml file."], ["D", "Set isExposed to true in the statusComponent.js-meta.xml file."]], "answer": "CD"}, {"id": 62, "source_num": 62, "question": "A developer must create a DrawList class that provides capabilities defined in the Sortable and Drawable interfaces. public interface Sortable { void sort(); } public interface Drawable { void draw(); } Which is the correct implementation?", "options": [["A", "public class DrawList implements Sortable, Drawable { public void sort() { /*implementation*/ public void draw() { /*implementation*/ }"]], "answer": "A"}, {"id": 63, "source_num": 63, "question": "A developer is alerted to an issue with a custom Apex trigger that is causing records to be duplicated. What is the most appropriate debugging approach to troubleshoot the issue?", "options": [["A", "Use the Apex Interactive Debugger to step through the code and identify the issue."], ["B", "Review the Historical Event logs to identify the source of the issue."], ["C", "Disable the trigger in production and test to see if the issue still occurs."], ["D", "Add system.debug statements to the code to track the execution flow and identify the issue."]], "answer": "D"}, {"id": 64, "source_num": 64, "question": "Which two characteristics are true for Lightning Web Component custom events?", "options": [["A", "Data may be passed in the payload of a custom event using a property called detail."], ["B", "By default a custom event only propagates to its immediate container and to its immediate child component."], ["C", "Data may be passed in the payload of a custom event using @wire decorated properties."], ["D", "By default a custom event only propagates to its immediate container."]], "answer": "AB"}, {"id": 65, "source_num": 65, "question": "The following code snippet is executed by a Lightning web component in an environment with more than 2,000 lead records: @AuraEnabled public void static updateLeads() { for(lead thisLead : [SELECT Origin__c FROM Lead]) { thisLead.leadSource = thisLead.Origin__c; update thisLead; } Which governor limit will likely be exceeded within the Apex transaction?", "options": [["A", "Total number of records processed as a result of DML statements"], ["B", "Total number of DML statements issued"], ["C", "Total number of records retrieved by SOQL queries"], ["D", "Total number of SOQL queries issued"]], "answer": "D"}, {"id": 66, "source_num": 66, "question": "Assuming that name is a String obtained by an <apex:inputText> tag on a Visualforce page, which two SOQL queries performed are safe from SOQL injection?", "options": [["A", "String query = 'SELECT Id FROM Account WHERE Name LIKE \\ '%' + name + '%\\''; List<Account> results = Database.query(query);"], ["B", "String query = 'SELECT Id FROM Account WHERE Name LIKE \\ '%' + String.escapesingleQuotes(name) + '%\\''; List<Account> results = Database.query(query);"], ["C", "String query = '%' + name + '%'; List<Account> results = [SELECT Id FROM Account WHERE Name LIKE :query];"], ["D", "String query = 'SELECT Id FROM Account WHERE Name LIKE \\ '%' + name.noQuotes() + '%\\''; List<Account> results = Database.query(query);"]], "answer": "BC"}, {"id": 67, "source_num": 67, "question": "As part of new feature development, a developer is asked to build a responsive application capable of responding to touch events that will be executed on stateful clients. Which two technologies are built on a framework that fully supports the business requirement?", "options": [["A", "Visualforce Components"], ["B", "Lightning Web Components"], ["C", "Aura Components"], ["D", "Visualforce Pages"]], "answer": "BC"}, {"id": 68, "source_num": 68, "question": "Universal Containers recently transitioned from Classic to Lightning Experience. One of its business processes requires certain values from the Opportunity object to be sent via an HTTP REST callout to its external order management system when the user presses a custom button on the Opportunity detail page. Example values are as follows: - Name - Amount - Account Which two methods should the developer implement to fulfill the business requirement?", "options": [["A", "Create a custom Visualforce quick action that performs the HTTP REST callout, and use a Visualforce quick action to expose the component on the Opportunity detail page."], ["B", "Create a Remote Action on the Opportunity object that executes an Apex immediate action to perform the HTTP REST callout whenever the Opportunity is updated."], ["C", "Create a Lightning component quick action that performs the HTTP REST callout, and use a Lightning Action to expose the component on the Opportunity detail page."], ["D", "Create an after update trigger on the Opportunity object that calls a helper method using @Future(Callout=true) to perform the HTTP REST callout."]], "answer": "AC"}, {"id": 69, "source_num": 69, "question": "Given the following Apex statement: Account myAccount = [SELECT Id, Name FROM Account]; What occurs when more than one Account is returned by the SOQL query?", "options": [["A", "An unhandled exception is thrown and the code terminates."], ["B", "The variable, myAccount, is automatically cast to the List data type."], ["C", "The first Account returned is assigned to myAccount."], ["D", "The query fails and an error is written to the debug log."]], "answer": "A"}, {"id": 70, "source_num": 70, "question": "A Salesforce administrator used Flow Builder to create a flow named \"accountOnboarding\". The flow must be used inside an Aura component. Which tag should a developer use to display the flow in the component?", "options": [["A", "lightning-flow"], ["B", "lightning-flow"], ["C", "aura-flow"], ["D", "aura-flow"]], "answer": "B"}, {"id": 71, "source_num": 71, "question": "A developer is asked to write helper methods that create test data for unit tests. 01: public TestUtils { 02: 03: public static Account createAccount() { 04: Account act = new Account(); 05: // ...set some fields on acct... 06: return act; 07: } 08: //...other methods... 09: } What should be changed in the TestUtils class so that its methods are only usable by unit test methods?", "options": [["A", "Add @IsTest above line 03."]], "answer": "A"}, {"id": 72, "source_num": 72, "question": "Refer to the following Apex code: Integer x = 0; do { x = 1; x++; } while (x < 1); System.debug(x); What is the value of x when it is written to the debug log?", "options": [["A", "1"], ["B", "3"], ["D", "2"]], "answer": "D"}, {"id": 73, "source_num": 73, "question": "Which two actions may cause triggers to fire?", "options": [["A", "Cascading delete operations"], ["B", "Changing a user's default division when the transfer division option is checked"], ["C", "Renaming or replacing a picklist entry"], ["D", "Updates to FeedItem"]], "answer": "BC"}, {"id": 74, "source_num": 74, "question": "A developer wants to import 500 Opportunity records into a sandbox. Why should the developer choose to use Data Loader instead of Data Import Wizard?", "options": [["A", "Data Loader automatically relates Opportunities to Accounts."], ["B", "Data Loader runs from the developer’s browser."], ["C", "Data Import Wizard can not import all 500 records."], ["D", "Data Import Wizard does not support Opportunities."]], "answer": "D"}, {"id": 75, "source_num": 75, "question": "What are two characteristics related to formulas?", "options": [["A", "Formulas can reference themselves."], ["B", "Formulas are calculated at runtime and are not stored in the database."], ["C", "Fields that are used in a formula field can be deleted or edited without editing the formula."], ["D", "Formulas can reference values in related objects."]], "answer": "BD"}, {"id": 76, "source_num": 76, "question": "What should a developer use to fix a Lightning web component bug in a sandbox?", "options": [["A", "Force.com IDE"], ["B", "Execute Anonymous"], ["C", "Developer Console"], ["D", "VS Code"]], "answer": "D"}, {"id": 77, "source_num": 77, "question": "Developers at Universal Containers (UC) use version control to share their code changes, but they notice that when they deploy their code to different environments they often have failures. They decide to set up Continuous Integration (CI). What should the UC development team use to automatically run tests as part of their CI process?", "options": [["A", "Force.com Toolkit"], ["B", "Salesforce CLT"], ["C", "Visual Studio Code"], ["D", "Developer Console"]], "answer": "B"}, {"id": 78, "source_num": 78, "question": "A developer is asked to prevent anyone other than a user with Sales Manager profile from changing the Opportunity Status to Closed Lost if the lost reason is blank. Which automation allows the developer to satisfy this requirement in the most efficient manner?", "options": [["A", "An approval process on the Opportunity object"], ["B", "An Apex trigger on the Opportunity object"], ["C", "A record trigger flow on the Opportunity object"], ["D", "An error condition formula on a validation rule on Opportunity"]], "answer": "D"}, {"id": 79, "source_num": 79, "question": "A developer has a single custom controller class that works with a Visualforce Wizard to support creating and editing multiple sObjects. The wizard accepts data from user inputs across multiple Visualforce pages and from a parameter on the initial URL. Which three statements are useful inside the unit test to effectively test the custom controller?", "options": [["A", "insert pageRef;"], ["B", "public ExtendedController(ApexPages.StandardController cntrl) {"], ["C", "ApexPages.currentPage().getParameters().put('input', 'TestValue');"], ["D", "String nextPage = controller.save().getUrl(); E.Test.setCurrentPage(pageRef);"]], "answer": "CD"}, {"id": 80, "source_num": 80, "question": "What is an example of a polymorphic lookup field in Salesforce?", "options": [["A", "The WhatId field on the standard Event object"], ["B", "The ParentId field on the standard Account object"], ["C", "A custom field, Link__c, on the standard Contact object that looks up d": 85, "source_num": 85, "question": "A developer wants to get access to the standard price book in the org while writing a test class that covers an OpportunityLineIterator trigger. Which method allows access to the price book?", "options": [["A", "Use Test.getStandardPricebookId() to get the standard price book ID."], ["B", "Use Test.loadData() and a static resource to load a standard price book."], ["C", "Use @IsTest(SeeAllData=true) and delete the existing standard price book."], ["D", "Use @TestVisible to allow the test method to see the standard price book."]], "answer": "A"}, {"id": 86, "source_num": 86, "question": "A company decides to implement a new process where every time an Opportunity is created, a follow up Task should be created and assigned to the Opportunity Owner. What is the most efficient way for a developer to implement this?", "options": [["A", "Record-triggered flow on Opportunity"], ["B", "Auto-launched flow on Task"], ["C", "Task actions"], ["D", "Apex trigger on Task"]], "answer": "D"}, {"id": 87, "source_num": 87, "question": "A developer wants to mark each Account in a List<Account> as either Active or Inactive, based on the value in the LastModifiedDate field of each Account being greater than 90 days in the past. Which Apex technique should the developer use?", "options": [["A", "A for loop, with an if or if/else statement inside"], ["B", "An if-else statement, with a for loop inside"], ["C", "A switch statement, with a for loop inside"], ["D", "A for loop, with a switch statement inside"]], "answer": "A"}, {"id": 88, "source_num": 88, "question": "A custom object Trainer _c has a lookup field to another custom object Gym _c. Which SOQL query will get the record for the Viridian City Gym and all it's trainers?", "options": [["A", "SELECT Id, (SELECT Id FROM Trainers_c) FROM Gym _c WHERE Name = 'Viridian City Gym'"], ["B", "SELECT Id, (SELECT Id FROM Trainers_r) FROM Gym _c WHERE Name = 'Viridian City Gym'"], ["C", "SELECT ID FROM Trainer _c WHERE Gym_r.Name = 'Viridian City Gym'"], ["D", "SELECT Id, (SELECT Id FROM Trainer_c) FROM Gym _c WHERE Name = 'Viridian City Gym'"]], "answer": "B"}, {"id": 89, "source_num": 89, "question": "Which annotation should a developer use on an Apex method to make it available to be wired to a property in a Lightning web component?", "options": [["A", "@AuraEnabled(cacheable=true)"], ["B", "@AuraEnabled"], ["C", "@RemoteAction(cacheable=true)"], ["D", "@RemoteAction"]], "answer": "A"}, {"id": 90, "source_num": 90, "question": "An Apex method, getAccounts, that returns a list of Accounts given a searchTerm, is available for Lightning Web Components to use. What is the correct definition of a Lightning Web Component property that uses the getAccounts method?", "options": [["A", "@wire(getAccounts, { searchTerm: '$searchTerm' }) accountList;"], ["B", "@AuraEnabled(getAccounts, '$searchTerm') accountList;"], ["C", "@wire(getAccounts, '$searchTerm') accountList;"], ["D", "@AuraEnabled(getAccounts, { searchTerm: '$searchTerm' }) accountList;"]], "answer": "A"}, {"id": 91, "source_num": 91, "question": "A developer must troubleshoot to pinpoint the causes of performance issues when a custom page loads in their org. Which tool should the developer use to troubleshoot query performance?", "options": [["A", "Visual Studio Code IDE"], ["B", "AppExchange"], ["C", "Developer Console"], ["D", "Setup Menu"]], "answer": "C"}, {"id": 92, "source_num": 92, "question": "The sales management team at Universal Containers requires that the Lead Source field of the Lead record be populated when a Lead is converted. What should be done to ensure that a user populates the Lead Source field prior to converting a Lead?", "options": [["A", "Use a validation rule."], ["B", "Use Lead Conversion field mapping."], ["C", "Use a formula field."], ["D", "Create an after trigger on Lead."]], "answer": "A"}, {"id": 93, "source_num": 93, "question": "A developer is creating a page that allows users to create multiple Opportunities. The developer is asked to verify the current user's default Opportunity record type, and set certain default values based on the record type before inserting the record. How can the developer find the current user's default record type?", "options": [["A", "Query the Profile where the ID equals `userInfo.getProfileID()` and then use the profile.Opportunity.getDefaultRecordType() method."], ["B", "Use the `Schema.userInfo.Opportunity.getDefaultRecordType()` method."], ["C", "Use `opportunity.SObjectType.getDescribe().getRecordTypeInfos()` to get a list of record types, and iterate through them until `isDefaultRecordTypeMapping()` is true."], ["D", "Create the opportunity and check the `opportunity.recordType`, which will have the record ID of the current user's default record type, before inserting."]], "answer": "C"}, {"id": 94, "source_num": 94, "question": "What are two ways a developer can get the status of an enqueued job for a class that implements the queueable interface?", "options": [["A", "Query the AsyncApexJob object"], ["B", "View the Apex Jobs page"], ["C", "View the Apex Flex Queue"], ["D", "View the Apex Status page"]], "answer": "AB"}, {"id": 95, "source_num": 95, "question": "A credit card company needs to implement the functionality for a service agent to process damaged or stolen credit cards. When the customers call in, the service agent must gather many pieces of information. A developer is tasked to implement this functionality. What should the developer use to satisfy this requirement in the most efficient manner?", "options": [["A", "Apex trigger"], ["B", "Lightning Component"], ["C", "Approval process"], ["D", "Screen-based flow"]], "answer": "D"}, {"id": 96, "source_num": 96, "question": "A developer creates a custom exception as shown below: public class ParityException extends Exception {} What are two ways the developer can fire the exception in Apex?", "options": [["A", "new ParityException('parity does not match');"], ["B", "throw new ParityException('parity does not match');"], ["C", "throw new ParityException();"], ["D", "new ParityException();"]], "answer": "BC"}, {"id": 97, "source_num": 97, "question": "Which statement describes the execution order when triggers are associated to the same object and event?", "options": [["A", "Triggers are executed in the order they are modified."], ["B", "Trigger execution order cannot be guaranteed."], ["C", "Triggers are executed alphabetically by trigger name."], ["D", "Triggers are executed in the order they are created."]], "answer": "B"}, {"id": 98, "source_num": 98, "question": "While developing an Apex class with custom search functionality that will be launched from a Lightning Web Component, how can the developer ensure only records accessible to the currently logged in user are displayed?", "options": [["A", "Use the `with` sharing keyword."], ["B", "Use the `inherited` sharing keyword."], ["C", "Use the `without` sharing keyword."], ["D", "Use the WITH_SECURITY_ENFORCED clause within the SOQL."]], "answer": "A"}, {"id": 99, "source_num": 99, "question": "A developer is tasked to perform a security review of the ContactSearch Apex class that exists in the system. Within the class, the developer identifies the following method as a security threat: List<Contact> performance(String lastName){ return Database.query('SELECT Id, FirstName, LastName FROM Contact WHERE LastName Like %'+lastName+ '%'); } What are two ways the developer can update the method to prevent a SOQL injection attack?", "options": [["A", "Use the escapeSingleQuotes method to sanitize the parameter before its use."], ["B", "Use the @ReadOnly annotation and the with sharing keyword on the class."], ["C", "Use variable binding and replace the dynamic query with a static SOQL."]], "answer": "AC"}, {"id": 100, "source_num": 100, "question": "What should a developer do to check the code coverage of a class after running all tests?", "options": [["A", "View the Code Coverage column in the list view on the Apex Classes page."], ["B", "Select and run the class on the Apex Test Execution page in the Developer Console."], ["C", "View the code coverage percentage for the class using the Overall Code Coverage panel in the Developer Console Tests tab."], ["D", "View the Class Test Percentage tab on the Apex Class list view in Salesforce Setup."]], "answer": "A"}, {"id": 101, "source_num": 101, "question": "Universal Containers is developing a new Lightning web component for their marketing department. They want to ensure that the component is fine tuned and provides a seamless user experience. What are some benefits of using the Lightning Component framework?", "options": [["A", "Automatic support for accessibility standards"], ["B", "Easy integration with third-party libraries"], ["C", "Compatibility with all web browsers"], ["D", "Better performance due to client-side rendering"]], "answer": "B"}, {"id": 102, "source_num": 102, "question": "What are two considerations for deploying from a sandbox to production?", "options": [["A", "Should deploy during business hours to ensure feedback can be quickly addressed."], ["B", "All triggers must have at least one line of test coverage."], ["C", "At least 75% of Apex code must be covered by unit tests."], ["D", "Unit tests must have calls to the System.assert method."]], "answer": "BC"}, {"id": 103, "source_num": 103, "question": "Which statement should be used to allow some of the records in a list of records to be inserted if others fail to be inserted?", "options": [["A", "Database.insert(records, false)"], ["B", "insert records"], ["C", "insert (records, false)"], ["D", "Database.insert(records, true)"]], "answer": "A"}, {"id": 104, "source_num": 104, "question": "Given the following Anonymous block: List<Case> casesToUpdate = new List<Case>(); for(Case thisCase : [SELECT Id, Status FROM Case LIMIT 50000]) { thisCase.Status = 'Working'; casesToUpdate.add(thisCase); } try{ Database.update(casesToUpdate,false); }catch(Exception e){ System.debug(e.getMessage()); } What should a developer consider for an environment that has over 10,000 Case records?", "options": [["A", "The try-catch block will handle any DML exceptions thrown."], ["B", "The transaction will fail due to exceeding the governor limit."], ["C", "The try-catch block will handle exceptions thrown by governor limits."], ["D", "The transaction will succeed and changes will be committed."]], "answer": "B"}, {"id": 105, "source_num": 105, "question": "A developer needs to prevent the creation of Request_c records when certain conditions exist in the system. A RequestLogic class exists that checks the conditions. What is the correct implementation?", "options": [["A", "trigger RequestTrigger on Request_c (after insert) { RequestLogic.validateRecords(trigger.new); }"], ["B", "trigger RequestTrigger on Request_c (after insert) { if (RequestLogic.isValid(Request_c)) Request.addError('Your request cannot be created at this time.\"); }"], ["C", "trigger RequestTrigger on Request _c (before insert) { if (RequestLogic.isValid(Request _c)) Request.addError('Your request cannot be created at this time.\"); }"], ["D", "trigger RequestTrigger on Request _c (before insert) { RequestLogic.validateRecords(trigger.new); }"]], "answer": "D"}, {"id": 106, "source_num": 106, "question": "A custom Visualforce controller calls the `ApexPages.addMessage()` method, but no messages are rendering on the page. Which component should be added to the Visualforce page to display the message?", "options": [["A", "<apex:facet name=\"messages\" />"], ["B", "<apex:pageMessages />"], ["C", "<apex:pageMessage severity=\"info\" />"], ["D", "<apex:message for=\"info\"/>"]], "answer": "C"}, {"id": 107, "source_num": 107, "question": "Universal Containers has a large number of custom applications that were built using a third- party JavaScript framework and exposed using Visualforce pages. The company wants to update sing the Apex class, BodyFat, and its method, calculateBodyFat(). The product owner wants to ensure this method is accessible by the consumer of the application when developing customizations outside the ISV's package namespace. Which approach should a developer take to ensure calculateBodyFat() is accessible outside the package namespace?", "options": [["A", "Declare the class and method using the public access modifier."], ["B", "Declare the class and method using the global access modifier."], ["C", "Declare the class as public and use the global access modifier on the method."], ["D", "Declare the class as global and use the public access modifier on the method."]], "answer": "B"}, {"id": 114, "source_num": 114, "question": "A software company is using Salesforce to track the companies they sell their software to in the Account object. They also use Salesforce to track bugs in their software with a custom object, Bug__c. As part of a process improvement initiative, they want to be able to report on which companies have reported which bugs. Each company should be able to report multiple bugs and bugs can also be reported by multiple companies. What is needed to allow this reporting?", "options": [["A", "Roll-up summary field of Bug__c on Account"], ["B", "Lookup field on Bug__c to Account"], ["C", "Master-detail field on Bug__c to Account"], ["D", "Junction object between Bug__c and Account"]], "answer": "D"}, {"id": 115, "source_num": 115, "question": "Universal Containers wants to automatically assign new cases to the appropriate support representative based on the case origin. They have created a custom field on the Case object to store the support representative name. What is the best solution to assign the case to the appropriate support representative?", "options": [["A", "Use a formula field on the Case object."], ["B", "Use a trigger on the Case object."], ["C", "Use a validation rule on the Case object."], ["D", "Use an Assignment Flow element."]], "answ cifications?", "options": [["A", "Greater a test class to execute the business logic and run the test in the Developer Console."], ["B", "Run the code in an Execute Anonymous block in the Developer Console."], ["C", "Include a try/catch block to the Apex class."], ["D", "Include a savepoint and `Database.cellback()`."]], "answer": "C"}, {"id": 124, "source_num": 124, "question": "Universal Containers wants to assess the advantages of declarative development versus programmatic customization for specific use cases in its Salesforce implementation. What are two characteristics of declarative development over programmatic customization? Choose 2 answers", "options": [["A", "Declarative development does not require Apex test classes."], ["B", "Declarative development can be done using the Setup menu."], ["C", "Declarative code logic does not require maintenance or review."], ["D", "Declarative development has higher design limits and query limits."]], "answer": "AB"}, {"id": 125, "source_num": 125, "question": "How does the Lightning Component framework help developers implement solutions faster?", "options": [["A", "By providing device-awareness for mobile and desktops"], ["B", "By providing an Agile process with default steps"], ["C", "By providing change history and version control"], ["D", "By providing code review standards and processes"]], "answer": "A"}, {"id": 126, "source_num": 126, "question": "A developer created a custom order management app that uses an Apex class. The order is represented by an Order object and an OrderItem object that has master-detail relationship to Order. During order processing, an order may be split into multiple orders. What should a developer do to allow their code to move some existing OrderItem records to a new Order record?", "options": [["A", "Add without sharing to the Apex class declaration."], ["B", "Select the Allow repatenting option on the master-detail relationship."], ["C", "Change the master detail relationship to an e insert trigger to correctly map the records."], ["D", "Update the `PrimaryId_c` field definition to mark it as an External id."]], "answer": "D"}, {"id": 134, "source_num": 133, "question": "Considering the following code snippet: public static void insertAccounts(List<Account> theseAccounts){ for(Account thisAccount : theseAccounts){ if(thisAccount.website == null){ thisAccount.website = 'https://www.demo.com'; } } update theseAccounts; } When the code executes, a DML exception is thrown. How should a developer modify the code to ensure exceptions are handled graceful!", "options": [["A", "Implement the `up**** DML statement`."], ["B", "Remove null items from the list of Accounts`."], ["C", "Implement Change Data Capture`."], ["D", "Implement a try/catch block for the DML."]], "answer": "D"}, {"id": 135, "source_num": 134, "question": "How many Accounts will be inserted by the following block of code? for(Integer i = 0 ; i < 500; i++) { Account a = new Account (Name='New Account ' + i); insert a; }", "options": [["A", "0"], ["B", "100"], ["C", "500"], ["D", "150"]], "answer": "A"}, {"id": 136, "source_num": 135, "question": "The Job_Application__c custom object has a field that is a master-deta relationship to the Contact object, where the Contact object is the master. As part of a feature implementation, a developer needs to retrieve a list containing Contact records where the related Account Industry is 'Technology', while also retrieving the Contact's Job_Application__c records. Based on the object's relationships, what is the most efficient statement to retrieve the list of Contacts?", "options": [["A", "[SELECT Id, (SELECT Id FROM Job_Application__c) FROM Contact WHERE Account.Industry = 'Technology'];"], ["B", "[SELECT Id, (SELECT Id FROM Job_Application__c) FROM Contact WHERE Accounts.Industry = 'Technology'];"], ["C", "[SELECT Id, (SELECT Id FROM Job_Application__r) FROM Contact WHERE Accounts.Industry = 'Technology'];"], ["D", "[SELECT Id, (SELECT Id FROM Job_Application__s) FROM Contact WHERE Accounts.Industry = 'Technology'];"]], "answer": "D"}, {"id": 137, "source_num": 136, "question": "A developer must implement a CheckPaymentProcessor class that provides check processing payment capabilities that adhere to what is defined for payments in the PaymentProcessor interface. public interface PaymentProcessor { void pay(Decimal amount); } Which implementation is correct to use the PaymentProcessor interface class?", "options": [["A", "public class CheckPaymentProcessor implements PaymentProcessor { public void pay(Decimal amount) { // functional code here } }"], ["B", "[ ] public class CheckPaymentProcessor extends PaymentProcessor { public void pay(Decimal amount); }"]], "answer": "A"}, {"id": 138, "source_num": 137, "question": "A developer must write an Apex method that will be called from a Lightning component. The method may delete an Account stored in the accountRec variable. Which method should a developer use to ensure only users that should be able to delete Accounts can successfully perform deletions?", "options": [["A", "accountRec.isDeleteable()"], ["B", "schema.subjectType.Account.isDeleteable()"], ["C", "Account.isDeleteable()"], ["D", "accountRec.subjectType.isDeleteable()"]], "answer": "B"}, {"id": 139, "source_num": 138, "question": "A developer creates a Lightning web component that imports a method within an Apex class. When a Validate button is pressed, the method runs to execute complex validations. In this implementation scenario, which two options are part of the Controller according to the MVC architecture Choose 2 answers", "options": [["A", "JavaScript file"], ["B", "XML file"], ["C", "Apex class"], ["D", "HTML file"]], "answer": "AC"}, {"id": 140, "source_num": 139, "question": "A developer writes a trigger on the Account object on the before update event that increments a count field. A record triggered flow also increments the cou field every time that an Account is created or updated. W e the trigger to fire again."], ["B", "Rollup summary fields can cause the parent record to go through Save."], ["C", "The trigger may fire multiple times during a transaction."], ["D", "Duplicate rules are executed once all DML operations commit to the database."]], "answer": "BC"}, {"id": 154, "source_num": 153, "question": "Which Lightning Web Component custom event property settings enable the event to bubble up the containment hierarchy and cross the Shadow DOM boundary?", "options": [["A", "bubbles: true, composed: true"], ["B", "bubbles: true, composed: false"], ["C", "bubbles: false, composed: false"], ["D", "bubbles: false, composed: true"]], "answer": "A"}, {"id": 155, "source_num": 154, "question": "An org has an existing flow that edits an Opportunity with an Update Records element. A developer must update the flow to also create a Contact and store the created Contact's ID on the Opportunity. Which update must the developer make in the flow?", "options": [["A", "Add a new Update Records element."], ["B", "Add a new Create Records element."], ["C", "Add a new Get Records element."], ["D", "Add a new Roll Back Records element."]], "answer": "B"}, {"id": 156, "source_num": 155, "question": "Which three data types can a SOQL query return? Choose 3 answers", "options": [["A", "Object"], ["B", "Double"], ["C", "Long"], ["D", "List E. Integer"]], "answer": "AD"}, {"id": 157, "source_num": 156, "question": "A team of developers is working on a source-driven project that allows them to wor independently, with many different org configurations. Which type of Salesforce orgs should they use for their development?", "options": [["A", "Developer sandboxes"], ["B", "Developer orgs"], ["C", "Scratch orgs"], ["D", "Full Copy sandboxes"]], "answer": "C"}, {"id": 158, "source_num": 157, "question": "Which two are best practices when it comes to Aura component and application event handling? Choose 2 answers", "options": [["A", "Reuse the event logic in a component bundle gement System (OMS) that creates orders from its website and fulfils the orders. When the order is created in the OMS, an integration also creates an order record in Salesforce and relates it to the contact as identified by the email on the order. As the order goes through different stages in the OMS, the integration also updates it in Salesforce. The business notices that each update from the OMS creates a new order record in Salesforce. Which two actions should prevent the duplicate order records from being created in Salesforce? Choose 2 answers", "options": [["A", "Use the order member from the OMS as an external ID."], ["B", "Ensure that the order member in the OMS is unique."], ["C", "Use the email on the contact record as an external ID."], ["D", "Write a trigger on the Order object to delete the duplicates."]], "answer": "AB"}, {"id": 173, "source_num": 172, "question": "Managers at Universal Containers want to ensure that only decommissioned containers are able to be deleted in the system. To meet the business requirement a Salesforce developer adds \"Decommissioned\" as a picklist value for the `Status_=` custom field within the `Container_=` object. Which two approaches could a developer use to enforce only Container records with a status of \"Decommissioned\" can be deleted? Choose 2 answers", "options": [["A", "Seller record triggers flow"], ["B", "After querying"], ["C", "After record triggers flow"], ["D", "Validate rule"]], "answer": "BC"}, {"id": 174, "source_num": 173, "question": "A developer must perform a complex SOQL query that joins two objects in a Lightning component. How can the Lightning component execute the query?", "options": [["A", "Viewer do every a custom Lightning task compliant to request and invoke from the Lightning component."], ["B", "Invoke an object close with the method mentioned as 'accurateize' to perform the query."], ["C", "Q Use the Salesforce Streaming API to perform the SOQL query."], ["D", "Q Create a flow to execute
